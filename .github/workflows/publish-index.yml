# Publish index.json + icon.svg to GitHub Pages.
#
# Resulting index URL that users paste into DSH → 插件 → 发现 → 添加索引源:
#   https://<owner>.github.io/<repo>/index.json
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: GitHub Actions.
name: publish index

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: every version is pinned to a commit and stamped
          # with that commit's date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and self-check index.json
        run: node scripts/build-index.mjs

      - name: Assemble site
        run: |
          mkdir -p dist
          cp index.json dist/
          if [ -f icon.svg ]; then cp icon.svg dist/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4