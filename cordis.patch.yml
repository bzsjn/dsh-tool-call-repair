# dsh-tool-call-repair bundle patch
#
# 四层职责，任一关闭即整体旁路对应层。
#
#   工具修复    流层协议修复。上游把工具参数截断时，补发缺失的 block-end，
#               按 tool-calls / max-tokens 正常收尾，而不是让整轮失败。
#               同时决定残缺的工具调用是派发出去（模型会读到参数错误并重写），
#               还是丢弃。
#   空响应修复  上游返回「零内容的完成响应」时，把这一次改写成
#               EMPTY_RESPONSE 失败，让重试链有机会接手；不再当成一次成功的
#               空回答落库（那会污染历史，后续每轮都空）。
#   空响应次数  连续空响应的重试上限，0 表示不重试。用尽后按 stop 收尾——
#               对着一个明确不肯出字的上游反复重发，只是把额度烧光。
#   退化检测    思考流里连续出现纯应答短句（"好。""收到。"）时判定为复读，
#               截断这一段并按 max-tokens 收尾，而不是伪造 stop。
#   退化续跑    截断后在同一轮末尾补一条输入，让模型给出结论或调工具。
#               有每轮上限，不会无限续。
#   历史清洗    发请求前把历史里 content 为空的 assistant 消息摘出去。
#               这类消息是「零内容的完成响应」被当成成功落库留下的，一旦进
#               历史，后续每轮都会把它带给上游，有的上游直接回 stop + 零内容，
#               于是空转自我强化。清洗只改「发出去的消息」，不动磁盘记录。
#   重试次数    模型请求失败后的重试上限。覆盖 TRANSPORT（网关连接重置）、
#               SERVER、TIMEOUT、RATE_LIMIT、EMPTY_RESPONSE、MALFORMED_RESPONSE。
#               退避阶梯 1s,2s,4s,8s,16s,32s,64s,128s,240s...，12 次约 20 分钟。
#               DSH 内置 llm-retry 先跑自己的 5 次（约 15 秒），然后本插件接着跑长窗口。
#   token上限   本轮输出字符预算。达到即补发 block-end 并按截断收尾。
#               服务端不认 max_tokens，所以由客户端自己停。0 表示不干预。
- insert:
    - id: tool-call-repair
      name: 'dsh-tool-call-repair'
      config:
        工具修复: true
        空响应修复: true
        空响应次数: 3
        退化检测: true
        退化阈值: 2
        退化续跑: true
        退化续跑上限: 3
        历史清洗: true
        历史清洗占位: true
        重试次数: 12
        token上限: 0
        maxRetriesPerTurn: 40
        codes: ['*']
        initialDelayMs: 1000
        maxDelayMs: 240000
        jitterRatio: 0.2